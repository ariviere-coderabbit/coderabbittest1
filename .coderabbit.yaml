reviews:
  review_details: true   # makes CodeRabbit explicitly list ignored files in the walkthrough, so you can see path_filters working
  path_filters:
    - "!vendor/**"
  path_instructions:
    - path: "tests/**"
      instructions: >
        Flag any test that only checks truthiness (e.g. toBeTruthy(),
        toBeDefined()) without asserting an exact expected value. Also flag
        if there is no test covering zero, negative, or otherwise invalid
        input for the function under test.